# Lint and format rules for the mod's Python (Scripts/) and its tools.
# The game runs Python 3.7: target-version keeps newer syntax out.
target-version = "py37"
line-length = 100
extend-exclude = ["windows/vendor", "companion", "dist", "site"]

[format]
quote-style = "single"
line-ending = "lf"

[lint]
select = [
  "E", "W", "F",   # pycodestyle, pyflakes
  "B",             # bugbear: likely bugs
  "C90",           # complexity
  "SIM",           # simpler code
  "PL",            # pylint
  "UP",            # modern syntax (for 3.7)
  "RET", "PIE", "C4", "ISC", "PERF",
  "ANN",           # every function typed
  "SLF",           # no private access across modules or objects
  "ARG",           # no unused arguments
  "RUF", "FURB",   # Ruff's own and modern-Python checks
  "N",             # naming
  "TRY",           # exceptions done right (broad excepts: tools/check_excepts.py)
  "S110", "S112",  # no silent try/except/pass or continue
]
ignore = [
  # Game modules are imported where they are used: some do not exist yet when
  # the mod loads, and each import costs load time.
  "PLC0415",
  "PLR2004",  # numbers in comparisons: the game's own constants
  "E501",     # the formatter decides line length
  "ANN401",   # Any is right for EA's game objects (no type information)
  "TRY003",   # messages in exceptions are fine
  "RUF001", "RUF002", "RUF003",  # spoken text has real typographic characters
]

[lint.mccabe]
max-complexity = 12

[lint.pylint]
max-args = 6
max-branches = 14
max-returns = 8
max-statements = 50

[lint.per-file-ignores]
# Tests and tools may stay untyped; the mod's own code may not.
"mac/tests/*" = ["ANN", "SLF001", "ARG"]  # tests may look inside the module they test
"tools/*" = ["ANN"]
"mac/build.py" = ["ANN"]
