syntax = "proto3";

package simsight.v1;

// Game state and events, shared by the phone API and the game <-> bridge pipe.
// Sim and interaction ids are game uint64 values carried as strings so they
// survive JavaScript numbers.

enum Speed {
  SPEED_UNSPECIFIED = 0;
  SPEED_PAUSED = 1;
  SPEED_NORMAL = 2;
  SPEED_FAST = 3;
  SPEED_ULTRA = 4;
  // Game-chosen: everyone asleep or away. Not settable from the phone.
  SPEED_SUPER = 5;
}

enum NeedLevel {
  NEED_LEVEL_UNSPECIFIED = 0;
  NEED_LEVEL_GOOD = 1;
  NEED_LEVEL_OKAY = 2;
  NEED_LEVEL_LOW = 3;
  NEED_LEVEL_CRITICAL = 4;
}

enum ActionState {
  ACTION_STATE_UNSPECIFIED = 0;
  ACTION_STATE_RUNNING = 1;
  ACTION_STATE_QUEUED = 2;
}

message Clock {
  // Localized by the game where possible ("Monday", "14:05").
  string day = 1;
  string time = 2;
  Speed speed = 3;
}

message Need {
  // Stable key for the app to label and order: hunger, bladder, energy,
  // hygiene, fun, social.
  string key = 1;
  int32 percent = 2;
  NeedLevel level = 3;
}

message Mood {
  // Stable key from the game's mood tuning (e.g. "happy", "tense").
  string key = 1;
  // Game text in the player's language when available ("Very Happy").
  string name = 2;
  int32 intensity = 3;
}

message Moodlet {
  string name = 1;
  string description = 2;
  // Mood key the moodlet pushes toward, empty for none.
  string mood_key = 3;
  int32 weight = 4;
  // Sim minutes left, -1 when it does not expire.
  int32 minutes_left = 5;
  // Stable id (the game's tuning name), for telling moodlets apart while
  // their display name is still being localized.
  string key = 6;
}

message Action {
  string id = 1;
  string name = 2;
  ActionState state = 3;
  bool cancelable = 4;
}

message Sim {
  string id = 1;
  string first_name = 2;
  string last_name = 3;
  bool active = 4;
  // On the current lot (needs and actions only exist for instanced Sims).
  bool here = 5;
  Mood mood = 6;
  repeated Need needs = 7;
  repeated Moodlet moodlets = 8;
  repeated Action actions = 9;
  // Where a Sim who is not here is: "work", "school", or empty (elsewhere).
  string away_at = 10;
  // Job or school title, game text ("Line Cook").
  string career = 11;
  // While at work or school: when it ends ("5:00 PM").
  string until = 12;
  // Otherwise: when the next shift starts ("Wed 9:00 AM").
  string next_shift = 13;
  // Work performance towards the next promotion, 0-100.
  optional int32 performance = 14;
  repeated Relationship relationships = 15;
  repeated Skill skills = 16;
  // The room the Sim is in, when on the home lot.
  RoomRef room = 17;
  Goals goals = 18;
}

message Narration {
  // The Mac voice speaks automatic narration (hover, Sim actions).
  bool mac_voice = 1;
  bool sim_actions = 2;
}

message GameState {
  uint64 seq = 1;
  // False at the main menu, in Create a Sim, or while loading.
  bool in_game = 2;
  Clock clock = 3;
  int64 funds = 4;
  string household_name = 5;
  repeated Sim sims = 6;
  Narration narration = 7;
  // Windows the game is waiting on (questions, pickers), oldest first.
  repeated Dialog dialogs = 8;
  // Things on the lot to deal with, most urgent first (and food ready).
  repeated Problem problems = 9;
  // Sims on the lot who are not in the household.
  repeated Visitor visitors = 10;
  // Unpaid bills, simoleons (0 when none are due).
  int64 bills_owed = 11;
  // The Sim the camera follows ("" when free).
  string camera_follows = 12;
  // What the Mac voice announces by itself (set from the phone, kept on the Mac).
  MacAnnounce mac_announce = 13;
  // The computer the game runs on: "mac" or "windows" (set by the bridge),
  // for the phone app's wording and shortcuts.
  string platform = 14;
  // This computer's name (set by the bridge): how the phone app lists it.
  // Meeting points never get it.
  string computer = 15;
}

message MacAnnounce {
  // Event groups, as the phone's settings name them: messages, mood,
  // moodlet, need, action, game.
  repeated string groups = 1;
  // Conversations: off, labels, normal or all.
  string social = 2;
}

message Visitor {
  string sim_id = 1;
  string name = 2;
  RoomRef room = 3;
}

// A room by name, as the House tab names it.
message RoomRef {
  string id = 1;
  string kind = 2;
  int32 number = 3;
  string custom_name = 4;
  int32 floor = 5;
}

message Problem {
  // FIRE, BROKEN, PUDDLE, SPOILED, or FOOD (a meal ready to eat).
  string kind = 1;
  string target_id = 2;
  string name = 3;
  int32 distance = 4;
}

// A game window waiting for an answer: a question with buttons, a list to
// pick from (recipes, Sims, objects...) or a text box.
message Dialog {
  string id = 1;
  string title = 2;
  string text = 3;
  repeated DialogChoice choices = 4;
  // Picker rows; empty for a plain question.
  repeated DialogRow rows = 5;
  int32 min_selectable = 6;
  int32 max_selectable = 7;
  // A text box (name a Sim, a household...): its name for the answer.
  string text_input = 8;
  string text_default = 9;
}

message DialogChoice {
  // The game's response id (OK is 10001, Cancel 10002, custom buttons...).
  int32 id = 1;
  // Empty: the phone names it from the id.
  string text = 2;
  string reason = 3;
}

message DialogRow {
  string id = 1;
  string name = 2;
  string description = 3;
  bool enabled = 4;
  string reason = 5;
  bool selected = 6;
}

enum EventKind {
  EVENT_KIND_UNSPECIFIED = 0;
  EVENT_KIND_MOOD = 1;
  EVENT_KIND_MOODLET_ADDED = 2;
  EVENT_KIND_MOODLET_REMOVED = 3;
  EVENT_KIND_NEED = 4;
  EVENT_KIND_ACTION_STARTED = 5;
  EVENT_KIND_ACTION_QUEUED = 6;
  EVENT_KIND_ACTIVE_SIM = 7;
  EVENT_KIND_SPEED = 8;
  EVENT_KIND_FUNDS = 9;
  // A line the mod spoke on the Mac (hover, tooltips, dialogs).
  EVENT_KIND_SPOKEN = 10;
  // Left for work or school (subject: "work" or "school").
  EVENT_KIND_AWAY_STARTED = 11;
  // Back from work or school (subject: where from).
  EVENT_KIND_AWAY_ENDED = 12;
  // A game notification (corner message): subject is the title, detail the text.
  EVENT_KIND_NOTIFICATION = 13;
  // The game asks something: subject is the dialog title or text.
  EVENT_KIND_DIALOG = 14;
  // Something to deal with appeared: subject is the Problem kind, detail the object name.
  EVENT_KIND_PROBLEM = 15;
  // A visitor arrived on the lot: subject is the name.
  EVENT_KIND_VISITOR = 16;
  // Bills arrived: subject is the amount owed.
  EVENT_KIND_BILLS = 17;
  // A household Sim's relationship moved: subject is the other Sim, detail
  // the action under way; deltas in friendship_delta / romance_delta.
  EVENT_KIND_SOCIAL = 18;
  // A relationship gained a label: subject is the other Sim, detail the label.
  EVENT_KIND_RELATIONSHIP = 19;
  // A Sim could not reach where an action happens (the "blocked" bubble):
  // subject is the action, detail the game's reason (NO_PATH_FOUND,
  // BLOCKING_OBJECT, BUILD_BUY, RESERVATION...), object_name what is in the way.
  EVENT_KIND_ROUTE_FAIL = 20;
}

// Something the controlled Sim can interact with.
message Target {
  string id = 1;
  string name = 2;
  bool is_sim = 3;
  // The controlled Sim itself: its own interactions (self-care, phone...).
  bool is_self = 4;
  // Catalog group for objects (COMFORT, APPLIANCES, PLUMBING...), SIMS for Sims.
  string group = 5;
  // Metres from the controlled Sim.
  int32 distance = 6;
  // Catalog type, game text ("Refrigerators", "Showers").
  string kind = 7;
  // Extra search words from the catalog tags ("Fridge Refrigerator").
  string keywords = 8;
}

// One row of the game's pie menu for a target.
message Interaction {
  string id = 1;
  string name = 2;
  // Pie menu category, game text ("Friendly", "Romance"), empty at the top level.
  string category = 3;
  bool enabled = 4;
  // Why it is greyed out, game text.
  string reason = 5;
}

message Event {
  uint64 seq = 1;
  // Unix milliseconds, set by the bridge.
  int64 at = 2;
  EventKind kind = 3;
  string sim_id = 4;
  string sim_name = 5;
  // Kind-specific value: mood key, moodlet name, need key, action name...
  string subject = 6;
  // Kind-specific detail: need level name, moodlet description, funds delta...
  string detail = 7;
  // SOCIAL: how the relationship moved.
  int32 friendship_delta = 8;
  int32 romance_delta = 9;
  // ROUTE_FAIL: the object in the way or out of reach.
  string object_name = 10;
}

// The house, room by room, for a mental map of the lot.
message HouseMap {
  repeated Room rooms = 1;
  // Ground floor is 0, basements are negative.
  repeated int32 floors = 2;
  repeated Stairs stairs = 3;
  // Some names were still loading: ask again in a moment.
  bool names_pending = 4;
}

message Stairs {
  // The floor at the bottom; the stairs go up to floor + 1.
  int32 floor = 1;
  // Part of the floor: N, NE... or C.
  string part = 2;
  // Rooms at the bottom and at the top ("" when outside).
  string bottom_room_id = 3;
  string top_room_id = 4;
}

message Room {
  string id = 1;
  // What the room looks like from its furniture: KITCHEN, BATHROOM, BEDROOM,
  // NURSERY, DINING, LIVING, STUDY, ROOM (unknown) or EMPTY.
  string kind = 2;
  // 2 for "Bedroom 2" when the house has several; 0 when it is the only one.
  int32 number = 3;
  // Name the player gave the room, if any.
  string custom_name = 4;
  int32 floor = 5;
  // Size in metres (one tile is one metre).
  int32 width = 6;
  int32 depth = 7;
  int32 area = 8;
  // Part of the floor the room is in: N, NE, E, SE, S, SW, W, NW or C (middle).
  string part = 9;
  // The controlled Sim is in this room.
  bool here = 10;
  // From the controlled Sim, when on the same lot.
  int32 distance = 11;
  string bearing = 12;
  repeated RoomLink links = 13;
  repeated RoomItem items = 14;
  // First names of the Sims in the room.
  repeated string sims = 15;
  // A second kind when the room is open-plan ("Kitchen and Living room").
  string kind2 = 16;
  // Areas of an open-plan room: which part holds what.
  repeated RoomArea areas = 17;
}

message RoomArea {
  string kind = 1;
  // N, NE... or C.
  string side = 2;
}

message RoomLink {
  // Room on the other side, "" for outside.
  string room_id = 1;
  // A door between them; otherwise they only share a wall or an opening.
  bool door = 2;
  // "up" or "down" when the link is a staircase to another floor.
  string stairs = 4;
  // Side of this room the link is on: N, E, S, W...
  string side = 3;
}

message RoomItem {
  Target target = 1;
  // Where in the room: N, NE... or C for the middle.
  string side = 2;
}

message Relationship {
  string sim_id = 1;
  string name = 2;
  // -100..100.
  int32 friendship = 3;
  int32 romance = 4;
  // Game labels: "Good Friends", "Spouse", "Son"...
  repeated string labels = 5;
}

message Skill {
  string key = 1;
  string name = 2;
  int32 level = 3;
  int32 max_level = 4;
}

// What a Sim is working towards.
message Goals {
  // Aspiration name, its current milestone and that milestone's steps.
  string aspiration = 1;
  string milestone = 2;
  repeated Objective milestone_steps = 3;
  // Wants and fears shown in the game's wants panel.
  repeated Want wants = 4;
  // Today's work tasks and what the next promotion needs.
  repeated Objective work_tasks = 5;
  repeated Objective promotion_steps = 6;
}

message Objective {
  string name = 1;
  bool done = 2;
}

message Want {
  string name = 1;
  bool fear = 2;
}

// Something the controlled Sim carries, and where it can go.
message InventoryItem {
  Target item = 1;
  // How many in the stack (moved together).
  int32 count = 2;
  // Places on the lot that accept it (fridge, bookcase...), nearest first.
  repeated Target destinations = 3;
}
