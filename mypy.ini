# Type checks for the mod's Python (Scripts/). The game runs Python 3.7;
# every module starts with `from __future__ import annotations`, so modern
# annotation syntax is never evaluated in the game. EA's game modules have
# no type information: they count as Any, unless typings/ holds the stubs
# tools/ea_stubs.py makes from the installed game (local only).
[mypy]
strict = True
python_version = 3.10
files = Scripts, tools
mypy_path = Scripts:typings
explicit_package_bases = True
ignore_missing_imports = True
follow_imports = silent
warn_unused_ignores = True
warn_redundant_casts = True
warn_return_any = False
check_untyped_defs = True
no_implicit_optional = True
strict_equality = True

# Developer tools (tools/) run on the developer's machine, not in the game:
# checked, but not required to be fully typed (as in ruff.toml).
[mypy-tools.*]
disallow_untyped_defs = False
disallow_untyped_calls = False
disallow_incomplete_defs = False
disallow_any_generics = False
